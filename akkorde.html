<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akkordkompass</title>
  <style>
    :root {
      --bg: #141826;
      --surface: #1c2133;
      --surface-2: #272d44;
      --fg: #eceef5;
      --muted: #9aa1b8;
      --accent: #f2b544;
      --root: #ff6b5a;
      --line: rgba(255, 255, 255, 0.08);
      --white-key: #f5f1e8;
      --black-key: #1a1a1f;
      --key-text: #2a2a33;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 2rem max(16px, 4vw) 3rem;
    }

    main { max-width: 960px; margin: 0 auto; display: grid; gap: 2rem; }

    h1 { font-size: 2rem; letter-spacing: 1px; }
    h1 small { display: block; font-size: 0.9rem; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-top: 0.3rem; }

    h2 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin-bottom: 0.8rem;
    }

    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    button {
      font: inherit; cursor: pointer; color: var(--fg);
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.5rem 0.9rem; transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--surface-2); }
    button.active { background: var(--accent); border-color: var(--accent); color: #1a1a1f; font-weight: 600; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .mode .row { margin-bottom: 0.6rem; }
    .spellings { align-items: center; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-right: 0.2rem; }
    button.small { padding: 0.3rem 0.7rem; font-size: 0.9rem; }

    .keyname { font-size: 1.4rem; margin-top: 0.8rem; }
    .keyname span { color: var(--muted); font-size: 1rem; margin-left: 0.6rem; }

    .chords { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.6rem; }
    .chord {
      display: grid; gap: 0.2rem; text-align: left; padding: 0.8rem 0.9rem;
    }
    .chord .roman { font-size: 0.85rem; color: var(--muted); }
    .chord.active .roman { color: inherit; }
    .chord .name { font-size: 1.4rem; font-weight: 600; }
    .chord .notes { font-size: 0.85rem; color: var(--muted); }
    .chord.active .notes { color: inherit; }

    .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; max-width: 560px; }
    .pad {
      aspect-ratio: 1; display: grid; grid-template-rows: auto 1fr auto; text-align: left;
      padding: 0.6rem 0.7rem; border-radius: 10px; background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .pad .num { font-size: 0.7rem; color: var(--muted); }
    .pad .name { font-size: 1.25rem; font-weight: 700; align-self: center; }
    .pad .roman { font-size: 0.75rem; color: var(--muted); }
    .pad.active .num, .pad.active .roman { color: inherit; }
    .pad.empty { background: var(--surface); opacity: 0.4; }
    @media (max-width: 480px) { .pad .name { font-size: 1rem; } .pad { padding: 0.4rem 0.5rem; } }

    .detail { font-size: 1.1rem; margin-bottom: 0.8rem; }
    .detail b { font-size: 1.5rem; margin-right: 0.6rem; }
    .detail .tone { display: inline-block; margin-right: 0.8rem; }
    .detail .tone small { color: var(--muted); margin-left: 0.2rem; }

    .keyboard {
      position: relative; display: flex; height: 190px;
      background: #000; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--line);
    }
    .key { position: relative; }
    .key.white {
      flex: 1; background: var(--white-key); border-right: 1px solid #c9c4b8;
    }
    .key.black {
      position: absolute; top: 0; height: 60%; width: calc(100% / 15 * 0.6);
      background: var(--black-key); z-index: 2; border-radius: 0 0 4px 4px;
      margin-left: calc(100% / 15 * -0.3);
    }
    .key.on { background: var(--accent); }
    .key.on.root { background: var(--root); }
    .key .lab {
      position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
      font-size: 0.8rem; font-weight: 600; color: var(--key-text);
    }
    .key.black .lab { color: #fff; }
    .key.white:not(.on) .lab { color: #b8b2a4; font-weight: 400; }

    @media (max-width: 600px) {
      .keyboard { height: 140px; }
      .key .lab { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Akkordkompass <small>Tonart wählen, Akkorde sehen, Töne auf der Klaviatur finden</small></h1>
  </header>

  <section class="mode">
    <h2>Tonart</h2>
    <div class="row" id="modes"></div>
    <div class="row" id="roots"></div>
    <div class="row spellings" id="spellings"></div>
    <div class="row spellings" id="namings"></div>
    <div class="keyname" id="keyname"></div>
  </section>

  <section>
    <h2>Akkorde der Tonart</h2>
    <div class="chords" id="chords"></div>
    <div class="pads" id="pads" hidden></div>
  </section>

  <section>
    <h2>Klaviatur</h2>
    <div class="detail" id="detail"></div>
    <div class="keyboard" id="keyboard"></div>
  </section>
</main>

<script>
  // --- Musiktheorie -------------------------------------------------------
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };

  const MODES = {
    major: { label: 'Dur', suffix: '-Dur', steps: [2, 2, 1, 2, 2, 2, 1],
             roots: ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'] },
    minor: { label: 'Moll', suffix: '-Moll', steps: [2, 1, 2, 2, 1, 2, 2],
             roots: ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B'] },
  };

  // Schreibweise der Grundtöne: automatisch (gebräuchlichste Tonart), nur ♯ oder nur ♭
  const SPELLINGS = {
    auto:  { label: 'automatisch', roots: null },
    sharp: { label: '♯', roots: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'] },
    flat:  { label: '♭', roots: ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'] },
  };
  // Benennung: Deutsch (H/B), International (B/B♭) oder wie auf dem Akai-MPC-Display (Cmaj, Dmin, Bb)
  const NAMINGS = {
    de:   { label: 'Deutsch', quality: { '': '', m: 'm', '°': '°', '+': '+' } },
    intl: { label: 'International', quality: { '': '', m: 'm', '°': '°', '+': '+' } },
    mpc:  { label: 'MPC', quality: { '': 'maj', m: 'min', '°': 'dim', '+': 'aug' } },
  };
  const ASCII_ACC = { '-2': 'bb', '-1': 'b', '0': '', '1': '#', '2': '##' };

  function rootsFor(mode, spelling) {
    return SPELLINGS[spelling].roots || MODES[mode].roots;
  }

  const TRIADS = {
    '4,3': { label: 'Dur', sym: '', lower: false, rsuf: '' },
    '3,4': { label: 'Moll', sym: 'm', lower: true, rsuf: '' },
    '3,3': { label: 'vermindert', sym: '°', lower: true, rsuf: '°' },
    '4,4': { label: 'übermäßig', sym: '+', lower: false, rsuf: '+' },
  };
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  const TONE_NAMES = ['Grundton', 'Terz', 'Quinte'];

  function parseNote(str) {
    const letter = str[0];
    const acc = (str.match(/#/g) || []).length - (str.match(/b/g) || []).length;
    return { letter, acc, pc: (LETTER_PC[letter] + acc + 12) % 12 };
  }

  // Deutsche Schreibweise: H statt B, B statt B♭
  function noteName(n) {
    if (state.naming === 'mpc') return n.letter + ASCII_ACC[n.acc];
    if (state.naming === 'intl') return n.letter + ACC[n.acc];
    if (n.letter === 'B' && n.acc === 0) return 'H';
    if (n.letter === 'B' && n.acc === -1) return 'B';
    if (n.letter === 'B' && n.acc === -2) return 'B♭'; // Heses
    if (n.letter === 'B' && n.acc === 1) return 'H♯';
    return n.letter + ACC[n.acc];
  }

  function buildScale(root, steps) {
    const notes = [root];
    let li = LETTERS.indexOf(root.letter), pc = root.pc;
    for (let i = 0; i < 6; i++) {
      pc = (pc + steps[i]) % 12;
      li = (li + 1) % 7;
      const letter = LETTERS[li];
      let acc = pc - LETTER_PC[letter];
      if (acc > 6) acc -= 12;
      if (acc < -6) acc += 12;
      notes.push({ letter, acc, pc });
    }
    return notes;
  }

  function buildChords(scale) {
    return scale.map((_, d) => {
      const notes = [0, 2, 4].map(o => scale[(d + o) % 7]);
      const intervals = [1, 2].map(i => (notes[i].pc - notes[i - 1].pc + 12) % 12);
      const q = TRIADS[intervals.join(',')];
      let roman = q.lower ? ROMAN[d].toLowerCase() : ROMAN[d];
      roman += q.rsuf;
      // Töne auf die Klaviatur legen: Grundton in der ersten Oktave (C4 = 60)
      const midis = [60 + notes[0].pc];
      intervals.forEach(iv => midis.push(midis[midis.length - 1] + iv));
      const name = noteName(notes[0]) + NAMINGS[state.naming].quality[q.sym];
      return { degree: d, notes, quality: q, roman, name, midis };
    });
  }

  // --- Zustand ------------------------------------------------------------
  const state = { mode: 'major', root: 0, chord: 0, spelling: 'auto', naming: 'de', octave: 0 };
  let scale = [], chords = [];

  function recompute() {
    const mode = MODES[state.mode];
    const roots = rootsFor(state.mode, state.spelling);
    scale = buildScale(parseNote(roots[state.root]), mode.steps);
    chords = buildChords(scale);
  }

  // --- Rendering ----------------------------------------------------------
  const $ = id => document.getElementById(id);

  function renderModes() {
    $('modes').innerHTML = Object.entries(MODES).map(([k, m]) =>
      `<button data-mode="${k}" class="${k === state.mode ? 'active' : ''}">${m.label}</button>`).join('');
    $('spellings').innerHTML = '<span class="hint">Schreibweise:</span>' +
      Object.entries(SPELLINGS).map(([k, s]) =>
        `<button data-spelling="${k}" class="small ${k === state.spelling ? 'active' : ''}">${s.label}</button>`).join('');
    $('namings').innerHTML = '<span class="hint">Benennung:</span>' +
      Object.entries(NAMINGS).map(([k, n]) =>
        `<button data-naming="${k}" class="small ${k === state.naming ? 'active' : ''}">${n.label}</button>`).join('');
  }

  function renderRoots() {
    const roots = rootsFor(state.mode, state.spelling);
    $('roots').innerHTML = roots.map((r, i) =>
      `<button data-root="${i}" class="${i === state.root ? 'active' : ''}">${noteName(parseNote(r))}</button>`).join('');
    let name = noteName(scale[0]);
    if (state.mode === 'minor') name = name.toLowerCase();
    const accs = scale.reduce((s, n) => s + Math.abs(n.acc), 0);
    const sig = accs === 0 ? 'keine Vorzeichen' : `${accs} ${scale.some(n => n.acc < 0) ? '♭' : '♯'}`;
    $('keyname').innerHTML = `${name}${MODES[state.mode].suffix}<span>${sig} · Tonleiter: ${scale.map(noteName).join(' · ')}</span>`;
  }

  // MPC-Ansicht: 16 Pads, Pad 1 unten links, Stufen fortlaufend über die Oktaven
  function renderPads() {
    const mpc = state.naming === 'mpc';
    $('pads').hidden = !mpc;
    $('chords').hidden = mpc;
    if (!mpc) return;
    const pads = [];
    for (let row = 3; row >= 0; row--) {
      for (let col = 0; col < 4; col++) {
        const n = row * 4 + col; // 0-basiert
        const d = n % 7, oct = Math.floor(n / 7);
        const c = chords[d];
        const active = d === state.chord && oct === state.octave;
        pads.push(`<button class="pad ${active ? 'active' : ''}" data-chord="${d}" data-octave="${oct}">
          <span class="num">Pad ${n + 1}${oct ? ' · +' + oct + ' Okt.' : ''}</span>
          <span class="name">${c.name}</span>
          <span class="roman">${c.roman}</span></button>`);
      }
    }
    $('pads').innerHTML = pads.join('');
  }

  function renderChords() {
    renderPads();
    $('chords').innerHTML = chords.map((c, i) => `
      <button class="chord ${i === state.chord ? 'active' : ''}" data-chord="${i}">
        <span class="roman">${c.roman}</span>
        <span class="name">${c.name}</span>
        <span class="notes">${c.notes.map(noteName).join(' ')}</span>
      </button>`).join('');
  }

  function renderDetail() {
    const c = chords[state.chord];
    $('detail').innerHTML = `<b>${c.name}</b> ${c.quality.label} · Stufe ${c.roman}<br>` +
      c.notes.map((n, i) => `<span class="tone">${noteName(n)}<small>${TONE_NAMES[i]}</small></span>`).join('');
  }

  const WHITE_PCS = [0, 2, 4, 5, 7, 9, 11];
  let kbLow = 60; // unterstes C der Klaviatur (C4 = 60), zwei Oktaven

  function buildKeyboard(low) {
    kbLow = low;
    const kb = $('keyboard');
    let html = '', whiteIndex = 0;
    for (let m = low; m <= low + 24; m++) {
      const pc = m % 12;
      if (WHITE_PCS.includes(pc)) {
        html += `<div class="key white" data-midi="${m}"><span class="lab"></span></div>`;
        whiteIndex++;
      } else {
        html += `<div class="key black" data-midi="${m}" style="left: calc(100% / 15 * ${whiteIndex})"><span class="lab"></span></div>`;
      }
    }
    kb.innerHTML = html;
  }

  function renderKeyboard() {
    const c = chords[state.chord];
    const midis = c.midis.map(m => m + 12 * state.octave);
    const low = Math.floor(midis[0] / 12) * 12;
    if (low !== kbLow) buildKeyboard(low);
    document.querySelectorAll('#keyboard .key').forEach(k => {
      const m = +k.dataset.midi;
      const idx = midis.indexOf(m);
      k.classList.toggle('on', idx >= 0);
      k.classList.toggle('root', idx === 0);
      const lab = k.querySelector('.lab');
      if (idx >= 0) lab.textContent = noteName(c.notes[idx]);
      else if (m % 12 === 0) lab.textContent = 'C' + (Math.floor(m / 12) - 1);
      else lab.textContent = '';
    });
  }

  function renderAll() {
    recompute();
    renderModes();
    renderRoots();
    renderChords();
    renderDetail();
    renderKeyboard();
  }

  // --- Interaktion --------------------------------------------------------
  $('modes').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    state.mode = b.dataset.mode;
    renderAll();
  });
  $('spellings').addEventListener('click', e => {
    const b = e.target.closest('[data-spelling]');
    if (!b) return;
    state.spelling = b.dataset.spelling;
    renderAll();
  });
  $('namings').addEventListener('click', e => {
    const b = e.target.closest('[data-naming]');
    if (!b) return;
    state.naming = b.dataset.naming;
    state.octave = 0;
    renderAll();
  });
  $('roots').addEventListener('click', e => {
    const b = e.target.closest('[data-root]');
    if (!b) return;
    state.root = +b.dataset.root;
    renderAll();
  });
  function onChordClick(e) {
    const b = e.target.closest('[data-chord]');
    if (!b) return;
    state.chord = +b.dataset.chord;
    state.octave = +(b.dataset.octave || 0);
    renderChords();
    renderDetail();
    renderKeyboard();
  }
  $('chords').addEventListener('click', onChordClick);
  $('pads').addEventListener('click', onChordClick);

  buildKeyboard(60);
  renderAll();
</script>
</body>
</html>
