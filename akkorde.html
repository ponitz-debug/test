<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akkordkompass</title>
  <style>
    :root {
      --bg: #141826;
      --surface: #1c2133;
      --surface-2: #272d44;
      --fg: #eceef5;
      --muted: #9aa1b8;
      --accent: #f2b544;
      --root: #ff6b5a;
      --line: rgba(255, 255, 255, 0.08);
      --white-key: #f5f1e8;
      --black-key: #1a1a1f;
      --key-text: #2a2a33;
      /* MPC-Display */
      --mpc-bg: #101114;
      --mpc-pad: #3b3e45;
      --mpc-yellow: #e9e23c;
      --mpc-red: #e5392c;
      --mpc-text: #e8e8ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 2rem max(16px, 4vw) 3rem;
    }

    main { max-width: 1040px; margin: 0 auto; display: grid; gap: 2rem; }

    h1 { font-size: 2rem; letter-spacing: 1px; }
    h1 small { display: block; font-size: 0.9rem; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-top: 0.3rem; }

    h2 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin-bottom: 0.8rem;
    }

    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    button, select {
      font: inherit; cursor: pointer; color: var(--fg);
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.5rem 0.9rem; transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--surface-2); }
    button.active { background: var(--accent); border-color: var(--accent); color: #1a1a1f; font-weight: 600; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Einstellungen: drei beschriftete Zeilen */
    .settings { display: grid; gap: 0.8rem; }
    .setting { display: grid; grid-template-columns: 110px 1fr; gap: 0.6rem; align-items: start; }
    .setting .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); padding-top: 0.7rem; }
    .setting .row + .row { margin-top: 0.5rem; }
    @media (max-width: 520px) { .setting { grid-template-columns: 1fr; } .setting .label { padding-top: 0; } }

    .editor {
      grid-column: 2; margin-top: 0.6rem; padding: 0.9rem 1rem; background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; display: grid; gap: 0.6rem; max-width: 560px;
    }
    .editor h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
    .editor .param { display: grid; grid-template-columns: 120px 1fr 64px; gap: 0.6rem; align-items: center; font-size: 0.9rem; }
    .editor .param output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .editor input[type=range] { width: 100%; accent-color: var(--accent); }
    .editor .actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.2rem; }
    @media (max-width: 520px) { .editor { grid-column: 1; } .editor .param { grid-template-columns: 90px 1fr 56px; } }

    .keyname { font-size: 1.4rem; margin-top: 0.4rem; }
    .keyname span { color: var(--muted); font-size: 1rem; margin-left: 0.6rem; }

    .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; }
    .section-head h2 { margin: 0; }
    .section-head label { font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.5rem; align-items: center; }
    .section-head select { padding: 0.3rem 0.6rem; }

    .chords { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.6rem; }
    .chord { display: grid; gap: 0.2rem; text-align: left; padding: 0.8rem 0.9rem; }
    .chord .roman { font-size: 0.85rem; color: var(--muted); }
    .chord.active .roman { color: inherit; }
    .chord .name { font-size: 1.4rem; font-weight: 600; }
    .chord .notes { font-size: 0.85rem; color: var(--muted); }
    .chord.active .notes { color: inherit; }

    /* --- MPC Pad Perform ------------------------------------------------ */
    .mpc {
      display: grid; grid-template-columns: 220px 1fr; gap: 1rem;
      background: var(--mpc-bg); border-radius: 12px; padding: 1rem;
      border: 1px solid #2a2c33; color: var(--mpc-text);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
    .mpc-side { display: grid; gap: 0.4rem; align-content: start; }
    .mpc-label {
      font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: #a3a6b0;
      text-align: center; margin-top: 0.6rem; border-top: 1px solid #2a2c33; padding-top: 0.5rem;
    }
    .mpc-side select, .mpc-side .mpc-static, .mpc-side button {
      background: #1a1b20; border: 1px solid #2f3138; border-radius: 4px; color: var(--mpc-text);
      padding: 0.45rem 0.6rem; font-size: 1.05rem; font-weight: 600;
    }
    .mpc-side select.root { border-color: var(--mpc-red); }
    .mpc-selects { display: grid; grid-template-columns: 1fr 1.6fr; gap: 0.4rem; }
    .mpc-oct { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.4rem; align-items: center; }
    .mpc-oct span { text-align: center; font-weight: 700; }
    .mpc-side button:hover { background: #2a2c33; }

    .mpc-pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; }
    .mpad {
      aspect-ratio: 1.2; position: relative; display: flex; align-items: center; justify-content: center;
      background: var(--mpc-pad); border: 3px solid var(--mpc-yellow); color: var(--mpc-yellow);
      border-radius: 2px; font-size: clamp(1rem, 3.2vw, 1.7rem); font-weight: 600; cursor: pointer;
      padding: 0; transition: filter 0.1s;
    }
    .mpad:hover { filter: brightness(1.2); background: #4a4d55; }
    .mpad.isroot { border-color: var(--mpc-red); color: #ff6a60; }
    .mpad.active { background: #5a5d66; box-shadow: 0 0 0 2px #fff inset; }
    .mpad .num { position: absolute; top: 4px; left: 7px; font-size: 0.65rem; color: #cfd1d8; font-weight: 600; }
    .mpad .num b { color: #fff; }

    @media (max-width: 640px) {
      .mpc { grid-template-columns: 1fr; }
      .mpc-side { grid-template-columns: 1fr 1fr; }
      .mpc-side .mpc-label { grid-column: 1 / -1; }
      .mpc-selects { grid-column: 1 / -1; }
    }

    /* --- Klaviatur, vier Oktaven --------------------------------------- */
    .detail-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.8rem; }
    .detail { font-size: 1.1rem; }
    #play[disabled] { opacity: 0.4; cursor: default; }
    .detail b { font-size: 1.5rem; margin-right: 0.6rem; }
    .detail .tone { display: inline-block; margin-right: 0.8rem; }
    .detail .tone small { color: var(--muted); margin-left: 0.2rem; }

    .keyboard {
      --whites: 28;
      position: relative; display: flex; height: 160px;
      background: #000; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--line);
    }
    .key { position: relative; }
    .key.white { flex: 1; background: var(--white-key); border-right: 1px solid #c9c4b8; }
    .key.black {
      position: absolute; top: 0; height: 60%; width: calc(100% / var(--whites) * 0.6);
      background: var(--black-key); z-index: 2; border-radius: 0 0 3px 3px;
      margin-left: calc(100% / var(--whites) * -0.3);
    }
    .key.on { background: var(--accent); }
    .key.on.root { background: var(--root); }
    .key .lab {
      position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
      font-size: 0.7rem; font-weight: 600; color: var(--key-text); overflow: hidden;
    }
    .key.black .lab { color: #fff; font-size: 0.6rem; }
    .key.white:not(.on) .lab { color: #b8b2a4; font-weight: 400; }

    @media (max-width: 700px) {
      .keyboard { height: 120px; }
      .key .lab { font-size: 0.55rem; }
      .key.black .lab { font-size: 0.5rem; }
      .key.white:not(.on) .lab { display: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Akkordkompass <small>Tonart wählen, Akkorde sehen, Töne auf der Klaviatur finden</small></h1>
  </header>

  <section class="settings">
    <div class="setting">
      <div class="label">Tonart</div>
      <div>
        <div class="row" id="modes"></div>
        <div class="row" id="roots"></div>
        <div class="keyname" id="keyname"></div>
      </div>
    </div>
    <div class="setting">
      <div class="label">Schreibweise</div>
      <div class="row" id="namings"></div>
    </div>
    <div class="setting">
      <div class="label">Ansicht</div>
      <div class="row" id="views"></div>
    </div>
    <div class="setting">
      <div class="label">Klang</div>
      <div class="row">
        <span id="sounds" class="row"></span>
        <select id="instrument" aria-label="Instrument"></select>
        <button id="editInstrument" type="button" class="small">Bearbeiten</button>
      </div>
      <div class="editor" id="editor" hidden></div>
    </div>
  </section>

  <section id="listview">
    <div class="section-head">
      <h2>Akkorde der Tonart</h2>
      <label>Akkordaufbau <select id="listChord" aria-label="Akkordformel"></select></label>
    </div>
    <div class="chords" id="chords"></div>
  </section>

  <section id="mpcview" hidden>
    <h2>Pad Perform · Chords</h2>
    <div class="mpc">
      <aside class="mpc-side">
        <div class="mpc-label">Scale &amp; Octave</div>
        <div class="mpc-selects">
          <select id="mpcRoot" class="root" aria-label="Grundton"></select>
          <select id="mpcScale" aria-label="Skala"></select>
        </div>
        <div class="mpc-label">Chord</div>
        <select id="mpcChord" aria-label="Akkordformel"></select>
        <div class="mpc-label">Banks</div>
        <div class="mpc-static">Start on root note</div>
        <div class="mpc-label">Octave</div>
        <div class="mpc-oct">
          <button id="octDown" type="button">−</button>
          <span id="octVal">0</span>
          <button id="octUp" type="button">+</button>
        </div>
      </aside>
      <div class="mpc-pads" id="mpcpads"></div>
    </div>
  </section>

  <section>
    <h2>Klaviatur</h2>
    <div class="detail-row">
      <div class="detail" id="detail"></div>
      <button id="play" type="button" title="Akkord abspielen">▶ Anhören</button>
    </div>
    <div class="keyboard" id="keyboard"></div>
  </section>
</main>

<script>
  // --- Musiktheorie -------------------------------------------------------
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
  const ASCII_ACC = { '-2': 'bb', '-1': 'b', '0': '', '1': '#', '2': '##' };

  // Grundtöne in der gebräuchlichen Schreibweise der jeweiligen Tonart
  const MODES = {
    major: { label: 'Dur', mpc: 'Major', suffix: '-Dur', steps: [2, 2, 1, 2, 2, 2, 1],
             roots: ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'] },
    minor: { label: 'Moll', mpc: 'Natural Minor', suffix: '-Moll', steps: [2, 1, 2, 2, 1, 2, 2],
             roots: ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B'] },
  };

  const NAMINGS = { de: 'Deutsch', intl: 'International' };
  const VIEWS = { piano: 'Klaviatur', mpc: 'MPC' };
  const SOUNDS = { on: 'An', off: 'Aus' };

  // Instrumente: einfache Synthese-Rezepte (Oszillatoren, Hüllkurve, Filter)
  const INSTRUMENTS = {
    keys: { label: 'Keys (Piano)', oct: 0, strum: 0.02, attack: 0.005, peak: 0.3, sustain: 0.06, hold: 0.35, release: 1.6,
            filter: 3200, voices: [['triangle', 1, 1], ['sine', 2, 0.35], ['sine', 3, 0.12], ['sine', 4, 0.05]] },
    pad:  { label: 'Pad (Fläche)', oct: 0, strum: 0.0, attack: 0.6, peak: 0.16, sustain: 0.14, hold: 2.5, release: 2.5,
            filter: 1400, voices: [['sawtooth', 1, 0.5, -7], ['sawtooth', 1, 0.5, 7], ['sine', 0.5, 0.4]] },
    synth:{ label: 'Synthesizer', oct: 0, strum: 0.0, attack: 0.01, peak: 0.25, sustain: 0.12, hold: 0.6, release: 0.8,
            filter: 2200, voices: [['sawtooth', 1, 0.7], ['square', 1, 0.3, 5]] },
    bass: { label: 'Bass', oct: -1, strum: 0.03, attack: 0.01, peak: 0.45, sustain: 0.2, hold: 0.5, release: 0.6,
            filter: 900, voices: [['triangle', 1, 1], ['sine', 1, 0.6], ['sawtooth', 1, 0.15]] },
  };

  // Akkordformeln als Skalenstufen relativ zum Grundton des Akkords (wie im MPC-Menü "Chord")
  const FORMULAS = ['1-3-5', '1-3-5-7', '1-3-5-6', '1-3-5-9', '1-4-5', '1-5-7', '1-2-5', '1-5'];

  const TRIADS = {
    '4,3': { label: 'Dur', sym: '', mpc: 'maj', lower: false, rsuf: '' },
    '3,4': { label: 'Moll', sym: 'm', mpc: 'min', lower: true, rsuf: '' },
    '3,3': { label: 'vermindert', sym: '°', mpc: 'dim', lower: true, rsuf: '°' },
    '4,4': { label: 'übermäßig', sym: '+', mpc: 'aug', lower: false, rsuf: '+' },
  };
  const SEVENTHS = {
    '4,3,4': { label: 'Dur mit großer Septime', sym: 'maj7', mpc: 'maj7', lower: false, rsuf: 'maj7' },
    '4,3,3': { label: 'Dominantseptakkord', sym: '7', mpc: '7', lower: false, rsuf: '7' },
    '3,4,3': { label: 'Moll-Septakkord', sym: 'm7', mpc: 'min7', lower: true, rsuf: '7' },
    '3,3,4': { label: 'halbvermindert', sym: 'ø7', mpc: 'min7b5', lower: true, rsuf: 'ø7' },
    '3,3,3': { label: 'vermindert (Septakkord)', sym: '°7', mpc: 'dim7', lower: true, rsuf: '°7' },
    '3,4,4': { label: 'Moll mit großer Septime', sym: 'mMaj7', mpc: 'minMaj7', lower: true, rsuf: 'mMaj7' },
    '4,4,3': { label: 'übermäßig mit großer Septime', sym: '+maj7', mpc: 'augMaj7', lower: false, rsuf: '+maj7' },
    '4,4,2': { label: 'übermäßig mit kleiner Septime', sym: '+7', mpc: 'aug7', lower: false, rsuf: '+7' },
  };
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  const TONE_NAMES = { 1: 'Grundton', 2: 'Sekunde', 3: 'Terz', 4: 'Quarte', 5: 'Quinte', 6: 'Sexte', 7: 'Septime', 8: 'Oktave', 9: 'None' };

  function parseNote(str) {
    const letter = str[0];
    const acc = (str.match(/#/g) || []).length - (str.match(/b/g) || []).length;
    return { letter, acc, pc: (LETTER_PC[letter] + acc + 12) % 12 };
  }

  // Notenname in der gewählten Schreibweise; 'device' = wie auf dem MPC-Display (Bb, F#)
  function noteName(n, naming = state.naming) {
    if (naming === 'device') return n.letter + ASCII_ACC[n.acc];
    if (naming === 'intl') return n.letter + ACC[n.acc];
    if (n.letter === 'B' && n.acc === 0) return 'H';
    if (n.letter === 'B' && n.acc === -1) return 'B';
    if (n.letter === 'B' && n.acc === -2) return 'B♭'; // Heses
    if (n.letter === 'B' && n.acc === 1) return 'H♯';
    return n.letter + ACC[n.acc];
  }
  const octaveOf = midi => Math.floor(midi / 12) - 1; // 60 = C4

  function buildScale(root, steps) {
    const notes = [root];
    let li = LETTERS.indexOf(root.letter), pc = root.pc;
    for (let i = 0; i < 6; i++) {
      pc = (pc + steps[i]) % 12;
      li = (li + 1) % 7;
      const letter = LETTERS[li];
      let acc = pc - LETTER_PC[letter];
      if (acc > 6) acc -= 12;
      if (acc < -6) acc += 12;
      notes.push({ letter, acc, pc });
    }
    return notes;
  }

  // Skalenton an Position i (0 = Grundton, 7 = Grundton eine Oktave höher) als MIDI-Nummer
  function scaleMidi(steps, rootMidi, i) {
    let m = rootMidi + 12 * Math.floor(i / 7);
    for (let k = 0; k < i % 7; k++) m += steps[k];
    return m;
  }

  // Akkord auf Skalenposition d nach Formel; rootMidi = Grundton der Skala
  function buildChord(scale, steps, rootMidi, d, formula) {
    const degrees = formula.split('-').map(Number);
    const notes = degrees.map(k => scale[(d + k - 1) % 7]);
    const midis = degrees.map(k => scaleMidi(steps, rootMidi, d + k - 1));
    const intervals = midis.slice(1).map((m, i) => m - midis[i]);
    const key = intervals.join(',');
    const quality = (midis.length === 3 ? TRIADS[key] : midis.length === 4 ? SEVENTHS[key] : null) || null;
    let roman = ROMAN[d % 7];
    if (quality) roman = (quality.lower ? roman.toLowerCase() : roman) + quality.rsuf;
    return { degree: d, degrees, notes, midis, quality, roman };
  }
  function chordName(c, naming = state.naming) {
    const root = noteName(c.notes[0], naming);
    if (!c.quality) return root + ' ' + c.degrees.join('-');
    return root + (naming === 'device' ? c.quality.mpc : c.quality.sym);
  }

  // --- Zustand ------------------------------------------------------------
  const state = {
    mode: 'major', root: 0, naming: 'de', view: 'piano', sound: 'on',
    formula: '1-3-5', chord: 0, pad: 0, mpcOctave: 0,
  };
  state.instrument = 'keys';
  state.editing = false;

  // Editierbare Grundparameter des Instruments (Schieberegler)
  const PARAMS = [
    { key: 'attack',  label: 'Anschlag',   min: 0.001, max: 1.5,  step: 0.001, unit: 's' },
    { key: 'hold',    label: 'Haltezeit',  min: 0.05,  max: 4,    step: 0.05,  unit: 's' },
    { key: 'release', label: 'Ausklang',   min: 0.1,   max: 5,    step: 0.1,   unit: 's' },
    { key: 'filter',  label: 'Filter',     min: 200,   max: 8000, step: 50,    unit: 'Hz' },
    { key: 'peak',    label: 'Lautstärke', min: 0.05,  max: 0.6,  step: 0.01,  unit: '' },
    { key: 'strum',   label: 'Arpeggio',   min: 0,     max: 0.15, step: 0.005, unit: 's' },
    { key: 'oct',     label: 'Oktave',     min: -2,    max: 2,    step: 1,     unit: '' },
  ];
  const DEFAULTS = JSON.parse(JSON.stringify(INSTRUMENTS));
  try {
    if (localStorage.getItem('akkordkompass.sound') === 'off') state.sound = 'off';
    const inst = localStorage.getItem('akkordkompass.instrument');
    if (INSTRUMENTS[inst]) state.instrument = inst;
    const saved = JSON.parse(localStorage.getItem('akkordkompass.params') || '{}');
    Object.keys(INSTRUMENTS).forEach(k => {
      PARAMS.forEach(p => { if (saved[k] && typeof saved[k][p.key] === 'number') INSTRUMENTS[k][p.key] = saved[k][p.key]; });
    });
  } catch (e) {}
  function saveParams() {
    const out = {};
    Object.entries(INSTRUMENTS).forEach(([k, i]) => { out[k] = {}; PARAMS.forEach(p => { out[k][p.key] = i[p.key]; }); });
    try { localStorage.setItem('akkordkompass.params', JSON.stringify(out)); } catch (e) {}
  }

  // --- Klang (Web Audio) --------------------------------------------------
  let audio = null;
  function playChord(midis) {
    if (state.sound !== 'on') return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { return; }
    const ins = INSTRUMENTS[state.instrument];
    const now = audio.currentTime;
    const master = audio.createGain();
    master.gain.value = 0.9 / Math.sqrt(midis.length);
    const filter = audio.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = ins.filter;
    filter.Q.value = 0.7;
    master.connect(filter).connect(audio.destination);
    const end = ins.attack + ins.hold + ins.release;
    midis.forEach((m, i) => {
      const t = now + i * ins.strum;
      const freq = 440 * Math.pow(2, (m + 12 * ins.oct - 69) / 12);
      const env = audio.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(ins.peak, t + ins.attack);
      env.gain.exponentialRampToValueAtTime(ins.sustain, t + ins.attack + ins.hold);
      env.gain.exponentialRampToValueAtTime(0.001, t + end);
      env.connect(master);
      ins.voices.forEach(([type, mult, vol, detune]) => {
        const osc = audio.createOscillator();
        osc.type = type;
        osc.frequency.value = freq * mult;
        if (detune) osc.detune.value = detune;
        const g = audio.createGain();
        g.gain.value = vol;
        osc.connect(g).connect(env);
        osc.start(t);
        osc.stop(t + end + 0.1);
      });
    });
  }
  let scale = [], chords = [], pads = [];

  function recompute() {
    const mode = MODES[state.mode];
    scale = buildScale(parseNote(mode.roots[state.root]), mode.steps);
    // Klaviatur-Ansicht: Akkorde ab Grundton in Oktave 3 (wie "Start on root note" auf der MPC)
    chords = scale.map((_, d) => buildChord(scale, mode.steps, 48 + scale[0].pc, d, state.formula));
    // MPC: 16 Pads ab Grundton in Oktave 3 (Bb3 = 58), "Start on root note"
    const padRoot = 48 + scale[0].pc + 12 * state.mpcOctave;
    pads = Array.from({ length: 16 }, (_, n) => buildChord(scale, mode.steps, padRoot, n, state.formula));
  }
  const currentChord = () => state.view === 'mpc' ? pads[state.pad] : chords[state.chord];

  // --- Rendering ----------------------------------------------------------
  const $ = id => document.getElementById(id);
  const toggles = (obj, attr, current, labelOf) => Object.entries(obj).map(([k, v]) =>
    `<button data-${attr}="${k}" class="${k === current ? 'active' : ''}">${labelOf(v)}</button>`).join('');

  function renderSettings() {
    $('modes').innerHTML = toggles(MODES, 'mode', state.mode, m => m.label);
    $('namings').innerHTML = toggles(NAMINGS, 'naming', state.naming, v => v);
    $('views').innerHTML = toggles(VIEWS, 'view', state.view, v => v);
    $('sounds').innerHTML = toggles(SOUNDS, 'sound', state.sound, v => v);
    $('play').disabled = state.sound !== 'on';
    $('instrument').disabled = state.sound !== 'on';
    $('instrument').innerHTML = Object.entries(INSTRUMENTS).map(([k, i]) =>
      `<option value="${k}" ${k === state.instrument ? 'selected' : ''}>${i.label}</option>`).join('');
    const roots = MODES[state.mode].roots;
    $('roots').innerHTML = roots.map((r, i) =>
      `<button data-root="${i}" class="${i === state.root ? 'active' : ''}">${noteName(parseNote(r))}</button>`).join('');
    let name = noteName(scale[0]);
    if (state.mode === 'minor') name = name.toLowerCase();
    const accs = scale.reduce((s, n) => s + Math.abs(n.acc), 0);
    const sig = accs === 0 ? 'keine Vorzeichen' : `${accs} ${scale.some(n => n.acc < 0) ? '♭' : '♯'}`;
    $('keyname').innerHTML = `${name}${MODES[state.mode].suffix}<span>${sig} · Tonleiter: ${scale.map(n => noteName(n)).join(' · ')}</span>`;
    $('editInstrument').disabled = state.sound !== 'on';
    $('editInstrument').classList.toggle('active', state.editing);
    renderEditor();
  }


  function renderEditor() {
    const ed = $('editor');
    ed.hidden = !(state.editing && state.sound === 'on');
    if (ed.hidden) return;
    const ins = INSTRUMENTS[state.instrument];
    ed.innerHTML = `<h3>${ins.label} bearbeiten</h3>` + PARAMS.map(p => `
      <label class="param">
        <span>${p.label}</span>
        <input type="range" id="param-${p.key}" data-param="${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${ins[p.key]}">
        <output for="param-${p.key}">${fmtParam(p, ins[p.key])}</output>
      </label>`).join('') +
      `<div class="actions"><button type="button" class="small" id="resetInstrument">Zurücksetzen</button>
       <button type="button" class="small" id="closeEditor">Schließen</button></div>`;
  }
  const fmtParam = (p, v) => (p.step < 1 ? (+v).toFixed(p.step < 0.01 ? 3 : 2) : String(v)) + (p.unit ? ' ' + p.unit : '');

  function renderChords() {
    const mpc = state.view === 'mpc';
    $('listview').hidden = mpc;
    $('mpcview').hidden = !mpc;
    if (mpc) { renderMpc(); return; }
    $('listChord').innerHTML = FORMULAS.map(f =>
      `<option value="${f}" ${f === state.formula ? 'selected' : ''}>${f}</option>`).join('');
    $('chords').innerHTML = chords.map((c, i) => `
      <button class="chord ${i === state.chord ? 'active' : ''}" data-chord="${i}">
        <span class="roman">${c.roman}</span>
        <span class="name">${chordName(c)}</span>
        <span class="notes">${c.notes.map(n => noteName(n)).join(' ')}</span>
      </button>`).join('');
  }

  function renderMpc() {
    const roots = MODES[state.mode].roots;
    $('mpcRoot').innerHTML = roots.map((r, i) =>
      `<option value="${i}" ${i === state.root ? 'selected' : ''}>${noteName(parseNote(r), 'device')}</option>`).join('');
    $('mpcScale').innerHTML = Object.entries(MODES).map(([k, m]) =>
      `<option value="${k}" ${k === state.mode ? 'selected' : ''}>${m.mpc}</option>`).join('');
    $('mpcChord').innerHTML = FORMULAS.map(f =>
      `<option value="${f}" ${f === state.formula ? 'selected' : ''}>${f}</option>`).join('');
    $('octVal').textContent = (state.mpcOctave > 0 ? '+' : '') + state.mpcOctave;
    // Pad 01 unten links, Pad 16 oben rechts; Beschriftung wie auf dem Gerät
    let html = '';
    for (let row = 3; row >= 0; row--) {
      for (let col = 0; col < 4; col++) {
        const n = row * 4 + col;
        const c = pads[n];
        const cls = ['mpad', c.degree % 7 === 0 ? 'isroot' : '', n === state.pad ? 'active' : ''].join(' ');
        html += `<button class="${cls}" data-pad="${n}" type="button">
          <span class="num"><b>C</b> ${String(n + 1).padStart(2, '0')}</span>
          ${noteName(c.notes[0], 'device')}${octaveOf(c.midis[0])}</button>`;
      }
    }
    $('mpcpads').innerHTML = html;
  }

  function renderDetail() {
    const c = currentChord();
    const mpc = state.view === 'mpc';
    const where = mpc ? `Pad ${String(state.pad + 1).padStart(2, '0')} · ` : '';
    const quality = c.quality ? c.quality.label : 'Akkordaufbau ' + state.formula;
    $('detail').innerHTML = `<b>${chordName(c)}</b> ${where}${quality} · Stufe ${c.roman}<br>` +
      c.notes.map((n, i) => `<span class="tone">${noteName(n)}${octaveOf(c.midis[i])}<small>${TONE_NAMES[c.degrees[i]] || c.degrees[i]}</small></span>`).join('');
  }

  // Klaviatur: vier Oktaven, Standard C2–C6, verschiebt sich oktavweise, wenn der Akkord nicht passt
  const WHITE_PCS = [0, 2, 4, 5, 7, 9, 11];
  const KB_OCTAVES = 4;
  let kbLow = -1;

  function buildKeyboard(low) {
    kbLow = low;
    let html = '', whiteIndex = 0;
    for (let m = low; m < low + 12 * KB_OCTAVES; m++) {
      if (WHITE_PCS.includes(m % 12)) {
        html += `<div class="key white" data-midi="${m}"><span class="lab"></span></div>`;
        whiteIndex++;
      } else {
        html += `<div class="key black" data-midi="${m}" style="left: calc(100% / var(--whites) * ${whiteIndex})"><span class="lab"></span></div>`;
      }
    }
    $('keyboard').style.setProperty('--whites', 7 * KB_OCTAVES);
    $('keyboard').innerHTML = html;
  }

  function renderKeyboard() {
    const c = currentChord();
    let low = 36; // C2
    const hi = Math.max(...c.midis), lo = Math.min(...c.midis);
    while (hi >= low + 12 * KB_OCTAVES) low += 12;
    while (lo < low) low -= 12;
    if (low !== kbLow) buildKeyboard(low);
    document.querySelectorAll('#keyboard .key').forEach(k => {
      const m = +k.dataset.midi;
      const idx = c.midis.indexOf(m);
      k.classList.toggle('on', idx >= 0);
      k.classList.toggle('root', idx === 0);
      const lab = k.querySelector('.lab');
      if (idx >= 0) lab.textContent = noteName(c.notes[idx]);
      else if (m % 12 === 0) lab.textContent = 'C' + octaveOf(m);
      else lab.textContent = '';
    });
  }

  function renderAll() {
    recompute();
    renderSettings();
    renderChords();
    renderDetail();
    renderKeyboard();
  }
  function renderSelection() {
    renderChords();
    renderDetail();
    renderKeyboard();
  }

  // --- Interaktion --------------------------------------------------------
  function onToggle(id, attr, apply) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest(`[data-${attr}]`);
      if (!b) return;
      apply(b.dataset[attr]);
      renderAll();
    });
  }
  onToggle('modes', 'mode', v => { state.mode = v; });
  onToggle('roots', 'root', v => { state.root = +v; });
  onToggle('namings', 'naming', v => { state.naming = v; });
  onToggle('views', 'view', v => { state.view = v; });
  onToggle('sounds', 'sound', v => {
    state.sound = v;
    try { localStorage.setItem('akkordkompass.sound', v); } catch (e) {}
  });
  $('play').addEventListener('click', () => playChord(currentChord().midis));
  $('editInstrument').addEventListener('click', () => { state.editing = !state.editing; renderSettings(); });
  $('editor').addEventListener('input', e => {
    const r = e.target.closest('[data-param]');
    if (!r) return;
    const p = PARAMS.find(x => x.key === r.dataset.param);
    INSTRUMENTS[state.instrument][p.key] = +r.value;
    r.nextElementSibling.textContent = fmtParam(p, +r.value);
  });
  $('editor').addEventListener('change', e => {
    if (!e.target.closest('[data-param]')) return;
    saveParams();
    playChord(currentChord().midis);
  });
  $('editor').addEventListener('click', e => {
    if (e.target.id === 'resetInstrument') {
      Object.assign(INSTRUMENTS[state.instrument], DEFAULTS[state.instrument]);
      saveParams();
      renderEditor();
      playChord(currentChord().midis);
    }
    if (e.target.id === 'closeEditor') { state.editing = false; renderSettings(); }
  });
  $('instrument').addEventListener('change', e => {
    state.instrument = e.target.value;
    try { localStorage.setItem('akkordkompass.instrument', state.instrument); } catch (e2) {}
    playChord(currentChord().midis);
  });

  $('chords').addEventListener('click', e => {
    const b = e.target.closest('[data-chord]');
    if (!b) return;
    state.chord = +b.dataset.chord;
    renderSelection();
    playChord(currentChord().midis);
  });
  $('mpcpads').addEventListener('click', e => {
    const b = e.target.closest('[data-pad]');
    if (!b) return;
    state.pad = +b.dataset.pad;
    renderSelection();
    playChord(currentChord().midis);
  });
  const setFormula = f => { state.formula = f; recompute(); renderSelection(); };
  $('listChord').addEventListener('change', e => setFormula(e.target.value));
  $('mpcChord').addEventListener('change', e => setFormula(e.target.value));
  $('mpcRoot').addEventListener('change', e => { state.root = +e.target.value; renderAll(); });
  $('mpcScale').addEventListener('change', e => { state.mode = e.target.value; renderAll(); });
  $('octDown').addEventListener('click', () => { if (state.mpcOctave > -2) { state.mpcOctave--; recompute(); renderSelection(); } });
  $('octUp').addEventListener('click', () => { if (state.mpcOctave < 3) { state.mpcOctave++; recompute(); renderSelection(); } });

  renderAll();
</script>
</body>
</html>
